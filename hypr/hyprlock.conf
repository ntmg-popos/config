# Глобальные настройки
general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

# Фон с размытием
background {
    monitor =
    path = screenshot # берет текущее изображение экрана
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 5 # 0 - выключить размытие
    blur_size = 15
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Аватарка (фото в круглой рамке)
image {
    monitor = eDP-1
    path = /home/c074rd/Изображения/avatar.jpg
    size = 100
    rounding = -1 # -1 делает круг
    border_size = 4
    border_color = rgb(221, 221, 221)
    rotate = 0
    reload_time = -0
    position = 0, -325
    halign = center
    valign = center
}

# Надпись "hello, Cotard"
label {
    monitor = eDP-1
    text = hello, Cotard
    color = rgba(200, 200, 200, 1.0)
    font_size = 25
    font_family = Noto Sans
    position = 0, -420
    halign = center
    valign = center
}

# Поле ввода пароля
input-field {
    monitor = eDP-1
    size = 200, 50
    outline_thickness = 0
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -477
    halign = center
    valign = center
}

# язык
label {
    monitor = eDP-1
    text = $LAYOUT # Переменная текущей раскладки
    color = rgba(200, 200, 200, 0.8)
    font_size = 14
    font_family = Noto Sans
    position = 0, -525 # Сразу под полем ввода
    halign = center
    valign = center
}

