bold_font        auto
font_size        11.0
text_composition_strategy legacy

shell /bin/bash

# Black (Черный / Фон для скрытого текста)
color0  #1e222a
color8  #5c6370

# Red (Красный — ошибки, алерты)
color1  #e06c75
color9  #f08891

# Green (Зеленый — папки, успешные команды)
color2  #98c379
color10 #b5e28c

# Yellow (Желтый — предупреждения)
color3  #d19a66
color11 #e5c07b

# Blue (Синий — директории, основной акцент под обои)
color4  #61afef
color12 #7ec2fc

# Magenta (Пурпурный — спец. символы)
color5  #c678dd
color13 #e06cf5

# Cyan (Бирюзовый — ссылки, инфо)
color6  #56b6c2
color14 #73d0dc

# White (Светло-серый/Белый — основной текст)
color7  #abb2bf
color15 #ffffff

background_opacity 0.5
dynamic_background_opacity yes
